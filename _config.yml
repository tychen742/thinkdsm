# Book settings
title: Think Data Science
author: "Tsangyao Chen"
copyright: "2026"
logo: ./_static/logo.png
language: en

# Execution settings
execute:
  execute_notebooks: auto
  exclude_tags: [skip-execution]
  timeout: 300
  allow_errors: true
  stderr_output: show
  output_cache: true

# Sphinx extensions - EXPLICITLY LIST EVERYTHING
sphinx:
  extra_extensions:
    - sphinx_new_tab_link
    - sphinx.ext.autodoc
    # sphinx_thebe is NOT here!
  config:
    new_tab_link_show_external_link_icon: true
    new_tab_link_enable_referrer: false
    html_use_index: true
    html_domain_indices: true
    templates_path: ['_templates']
    # Explicitly disable Thebe extension
    exclude_patterns: ['*.thebe']

# Launch buttons - REMOVE THIS SECTION TEMPORARILY
# launch_buttons:
#   thebe: true
#   binderhub_url: "https://mybinder.org"

# Repository information
repository:
  url: https://github.com/tychen742/dsm
  branch: main

# HTML/theme settings
html:
  use_numbered_headings: true
  number_toc_depth: 3
  favicon: ./_static/favicon-io_gg/favicon.ico
  extra_js:
    - custom-thebe-complete.js  # New all-in-one script
  html_theme_options:
    repository_url: https://github.com/tychen742/dsm
    repository_branch: main
    show_prev_next: true
    navigation_with_keys: true
    use_repository_button: true
    use_issues_button: true
    use_edit_page_button: true

# Bibliography
bibtex_bibfiles:
  - chapters/references.bib
bibtex_reference_style: label

# MyST parsing
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - html_admonition
    - html_image

# Exclusions
exclude_patterns:
  - .venv
  - assignments
  - materials
  - otter_files
  - temps
  - tests
  - .ipynb_checkpoints
  - .DS_Store
  - README.md
  - test3.ipynb
  - chapters/appendices/x_chap01-on-programming.ipynb
  - chapters/09-pandas/project-ecommerce-purchases-questions.ipynb
  - chapters/bibliography.md
  - images/**/*.ipynb
  - "**/.ipynb_checkpoints"   # Also exclude checkpoints anywhere
  - "**/*~"                   # Backup files
  - "**/.DS_Store"            # Mac files anywhere