# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Think Data Science
author: "Tsangyao Chen"
copyright: "2026"
logo: ./_static/logo.png
language: en

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: off
  exclude_tags: [skip-execution]
  timeout: 100
  allow_errors: true
  stderr_output: show
  output_cache: false

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - ./chapters/references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/tychen742/dsm
  branch: main

sphinx:
  extra_extensions:
    - sphinx_new_tab_link
    - sphinx.ext.autodoc
    - sphinx_thebe
  config:
    bibtex_reference_style: author_year
    new_tab_link_show_external_link_icon: true
    new_tab_link_enable_referrer: false
    html_use_index: true
    html_domain_indices: true
    thebe_config:
      repository_url: https://github.com/tychen742/dsm
      repository_branch: main
      selector: ".thebe-interactive"
    html_theme_options:
      launch_buttons:
        thebe: true
scholar:
  style: apa

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  use_numbered_headings: true
  use_edit_page_button: true
  number_toc_depth: 3
  favicon: ./_static/favicon-io_gg/favicon.ico

exclude_patterns:
  - ".venv"
  - "assignments"
  - "materials"
  - "otter_files"
  - "temps"
  - "tests"
  - ".ipynb_checkpoints"