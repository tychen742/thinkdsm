# Book settings
title: Think Data Science
author: "Tsangyao Chen"
copyright: "2026"
logo: ./_static/logo.png
language: en
only_build_toc_files: true

# Execution settings
# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: auto
  exclude_tags: [skip-execution]
  timeout: 100
  allow_errors: false
  stderr_output: show
  output_cache: true

# Sphinx settings
sphinx:
  extra_extensions:
    - sphinx_new_tab_link
    - sphinx.ext.autodoc
    - sphinx_thebe
    - sphinxcontrib.mermaid
    # - sphinxcontrib.bibtex
  config:
    # bibtex_reference_style: author_year  # not needed when citeproc handles citations
    html_static_path: ['_static']
    # extra_css:
    #   - custom.css
    # bibtex_reference_style: author_year  # not needed when citeproc handles citations
    new_tab_link_show_external_link_icon: true
    new_tab_link_enable_referrer: false
    html_use_index: true
    html_domain_indices: true
    thebe_config:
      repository_url: https://github.com/tychen742/dsm
      kernel_name: python3
      selector: "div.tag_thebe-interactive"
      selector_input: "div.cell_input"
      selector_output: "div.cell_output"
      # bootstrap: false
      # requestKernel: true
      # predefinedOutput: false  # Keep this true to show static output before execution
    html_theme_options:
      repository_url: https://github.com/tychen742/dsm
      repository_branch: main
      use_issues_button: true
      use_repository_button: true
      use_edit_page_button: true
      show_prev_next: true
      navigation_with_keys: true
      launch_buttons:
        thebe: true
        binderhub_url: "https://mybinder.org"

citeproc:
    style: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl

# Repository information
repository:
  url: https://github.com/tychen742/dsm
  branch: main

# HTML/theme settings
html:
  use_numbered_headings: true
  number_toc_depth: 3
  favicon: ./_static/favicon-io_gg/favicon.ico
  # extra_js:
  #   - auto-thebe.js

# Bibliography ==> use citeproc settings above
bibtex_bibfiles:
  - chapters/references.bib

# MyST parsing
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - html_admonition
    - html_image

exclude_patterns:
  - .venv
  - assignments
  - assignments/**
  - materials
  - materials/**
  - _build
  - otter_files
  - temps
  - tests
  - .ipynb_checkpoints
  - .DS_Store
  - README.md
  - test3.ipynb
  - chapters/appendices/x_chap01-on-programming.ipynb
  - chapters/09-pandas/project-ecommerce-purchases-questions.ipynb
  - images/**/*.ipynb
  - "**/*~"                   # Backup files
  - "**/.DS_Store"            # Mac files anywhere
