# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Think Data Science
author: "Tsangyao Chen"
copyright: "2026"
logo: ./_static/logo.png
language: en

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: auto
  exclude_tags: [skip-execution]
  timeout: 300
  allow_errors: true
  stderr_output: show
  output_cache: true

repository:
  url: https://github.com/tychen742/dsm
  branch: main

sphinx:
  extra_extensions:
    - sphinx_new_tab_link
    - sphinx.ext.autodoc
  config:
    thebe_config:
      auto_start: true
      always_on: true
    new_tab_link_show_external_link_icon: true
    new_tab_link_enable_referrer: false
    html_use_index: true
    html_domain_indices: true
    html_theme_options:
      repository_url: https://github.com/tychen742/dsm
      repository_branch: main
      navigation_with_keys: true
      use_repository_button: true
      use_issues_button: true
      use_edit_page_button: true
launch_buttons:
  thebe: true
  binderhub_url: "https://mybinder.org"


# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_numbered_headings: true
  number_toc_depth: 3
  favicon: ./_static/favicon-io_gg/favicon.ico

# Bibtex configuration
bibtex_bibfiles:
  - chapters/references.bib

bibtex_reference_style: label

parse:
  myst_enable_extensions:
    - "colon_fence"
    - "dollarmath"
    - "linkify"
    - "substitution"
    - html_admonition
    - html_image
    
exclude_patterns:
  - ".venv"
  - "assignments"
  - "materials"
  - "otter_files"
  - "temps"
  - "tests"
  - ".ipynb_checkpoints"
  - ".DS_Store"
  - "README.md"
  - "test3.ipynb"
  - "chapters/appendices/x_chap01-on-programming.ipynb"
  - "chapters/09-pandas/project-ecommerce-purchases-questions.ipynb"
  - "chapters/bibliography.md"
  - "images/**/*.ipynb"
