# Book settings
title: Think Data Science
author: "Tsangyao Chen"
copyright: "2026"
logo: ./_static/logo.png
language: en

# Execution settings
execute:
  execute_notebooks: auto
  exclude_tags: [skip-execution]
  timeout: 300
  allow_errors: true
  stderr_output: show
  output_cache: true

# Sphinx extensions and config
sphinx:
  config:
    # Sphinx-specific settings only
    # Override Jupyter Book's default extension list so we can replace `sphinx_thebe`
    # with a patched local copy (`dsm_sphinx_thebe`).
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      # - dsm_sphinx_thebe
      - sphinx_comments
      - sphinx_external_toc
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
      - sphinx_new_tab_link
      - sphinx.ext.autodoc
    new_tab_link_show_external_link_icon: true
    new_tab_link_enable_referrer: false
    html_use_index: true
    html_domain_indices: true
    thebe_config:
      repository_url: https://github.com/tychen742/dsm
      repository_branch: main
      # Only activate cells tagged `thebe-interactive` (Jupyter Book renders these as `div.cell.tag_thebe-interactive`)
      selector: "div.cell.tag_thebe-interactive"
      selector_input: "div.cell_input pre"
      selector_output: "div.cell_output"
    # thebe_config:
    #   repository_url: https://github.com/tychen742/dsm
    #   repository_branch: main
    #   selector: "div.cell.tag_thebe-interactive"
    #   # selector_input: "pre"
    #   selector_input: "div.cell_input pre"
    #   # selector_output: "div.cell_output"
    #   # selector_output: ".cell_output, .output, .cell_output pre"
    #   selector_output: ".cell_output, .output"


# Launch buttons (root level) keep the button visible but Thebe auto-starts
launch_buttons:
  thebe: true
  binderhub_url: "https://mybinder.org"


# Repository information
repository:
  url: https://github.com/tychen742/dsm
  branch: main

# HTML/theme settings
html:
  use_numbered_headings: true
  number_toc_depth: 3
  favicon: ./_static/favicon-io_gg/favicon.ico
  # extra_js:
  #   - custom.js  # ADD THIS LINE
  extra_css:
    - custom.css  # ADD THIS LINE
  html_theme_options:
    repository_url: https://github.com/tychen742/dsm
    repository_branch: main
    show_prev_next: true
    navigation_with_keys: true
    use_repository_button: true
    use_issues_button: true
    use_edit_page_button: true

# Bibliography
bibtex_bibfiles:
  - chapters/references.bib
bibtex_reference_style: label

# MyST parsing
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - html_admonition
    - html_image

# Exclusions
exclude_patterns:
  - .venv
  - assignments
  - materials
  - otter_files
  - temps
  - tests
  - .ipynb_checkpoints
  - .DS_Store
  - README.md
  - test3.ipynb
  - chapters/appendices/x_chap01-on-programming.ipynb
  - chapters/09-pandas/project-ecommerce-purchases-questions.ipynb
  - chapters/bibliography.md
  - images/**/*.ipynb
